name: Telvo
options:
  bundleIdPrefix: dev.neri
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Telvo:
    type: application
    platform: macOS
    sources:
      - path: Telvo
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: true
        codeSign: true
    info:
      path: Telvo/Info.plist
      properties:
        CFBundleDisplayName: Telvo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleName: Telvo
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # Servidores IPTV quase sempre usam http puro.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: O Telvo acessa servidores de listas IPTV na sua rede.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.neri.telvo
        PRODUCT_NAME: Telvo
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
