<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.92" cy="0.72" r="0.6">
      <stop offset="0" stop-color="#3D5AFE" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#3D5AFE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3D5AFE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D5AFE" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#1A2260"/>
      <stop offset="1" stop-color="#10121F"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78ADFF"/><stop offset="1" stop-color="#3D5AFE"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3D5AFE" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win"><rect width="1200" height="700" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="1200" height="700" fill="#0A0B10"/>
    <rect width="1200" height="700" fill="url(#glow)"/>
    <!-- botões da janela -->
    <circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/>
    <!-- barra lateral -->
    <rect x="0" y="0" width="76" height="700" fill="#FFFFFF" fill-opacity="0.03"/>
    <rect x="75" y="0" width="1" height="700" fill="#FFFFFF" fill-opacity="0.06"/>
    <g fill="#FFFFFF" fill-opacity="0.06">
      <rect x="16" y="188" width="44" height="44" rx="8"/>
      <rect x="16" y="314" width="44" height="44" rx="8"/><rect x="16" y="377" width="44" height="44" rx="8"/>
      <rect x="16" y="440" width="44" height="44" rx="8"/><rect x="16" y="503" width="44" height="44" rx="8"/>
      <rect x="16" y="566" width="44" height="44" rx="8"/>
    </g>
    <rect x="16" y="251" width="44" height="44" rx="8" fill="#3D5AFE"/>
    <g stroke="#8B93A8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="36" cy="208" r="7"/><path d="M41 213 L46 218"/>
      <rect x="27" y="327" width="18" height="13" rx="2"/><path d="M33 344 h6"/>
      <path d="M38 410 c-8-6-11-9-11-13 a5 5 0 0 1 11-1 a5 5 0 0 1 11 1 c0 4-3 7-11 13z"/>
      <rect x="28" y="455" width="20" height="14" rx="2"/><path d="M30 451 h16"/>
      <rect x="27" y="516" width="22" height="18" rx="2"/><path d="M27 521 h22 M27 529 h22"/>
      <circle cx="38" cy="588" r="5"/><circle cx="38" cy="588" r="10" stroke-dasharray="4 3"/>
    </g>
    <path d="M28 275 L38 266 L48 275 V284 H28 Z" fill="#FFFFFF"/>
    <!-- topo -->
    <rect x="124" y="56" width="36" height="36" rx="8" fill="url(#mark)"/>
    <path d="M137 65 L151 74 L137 83 Z" fill="#071225"/>
    <text x="172" y="84" font-size="28" font-weight="700" fill="#FFFFFF">Telvo</text>
    <!-- cartões -->
    <rect x="124" y="214" width="210" height="290" rx="8" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g filter="url(#shadow)">
      <rect x="352" y="196" width="222" height="308" rx="8" fill="url(#active)" stroke="#FFFFFF" stroke-opacity="0.24"/>
    </g>
    <rect x="602" y="214" width="210" height="290" rx="8" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="490" y="210" width="70" height="26" rx="5" fill="#3D5AFE"/>
    <text x="525" y="228" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Séries</text>
    <rect x="439" y="522" width="48" height="4" rx="2" fill="#3D5AFE"/>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round">
      <rect x="144" y="410" width="24" height="17" rx="2"/>
      <rect x="374" y="408" width="24" height="18" rx="2"/><path d="M377 403 h18"/>
      <rect x="622" y="408" width="26" height="20" rx="2"/><path d="M622 414 h26 M622 422 h26"/>
    </g>
    <g font-size="16" font-weight="600" fill="#FFFFFF">
      <text x="144" y="456">TV ao vivo</text><text x="374" y="456">Séries</text><text x="622" y="456">Filmes</text>
    </g>
    <g font-size="12" fill="#FFFFFF" fill-opacity="0.55">
      <text x="144" y="478">635 canais</text><text x="374" y="478">Temporadas e episódios</text><text x="622" y="478">Catálogo completo</text>
    </g>
    <!-- relógio -->
    <text x="1010" y="372" font-size="104" font-weight="200" fill="#FFFFFF" text-anchor="middle">22:55</text>
    <text x="1010" y="404" font-size="14" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">Sábado, 21 de novembro</text>
    <!-- continuar assistindo -->
    <text x="124" y="582" font-size="15" font-weight="600" fill="#D8DCE8">Continuar assistindo</text>
    <g fill="#1E2330" stroke="#FFFFFF" stroke-opacity="0.14">
      <rect x="124" y="600" width="104" height="150" rx="6"/><rect x="244" y="600" width="104" height="150" rx="6"/><rect x="364" y="600" width="104" height="150" rx="6"/>
